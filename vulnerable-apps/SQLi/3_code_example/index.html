<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Finder</title>
    <style>
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; background: #f6f8fb; color: #1f2933; }
      header { background: linear-gradient(135deg, #2563eb, #5b8df7); color: #fff; padding: 2rem 1.5rem; }
      header h1 { margin: 0 0 .35rem 0; }
      header p { margin: 0; color: rgba(255,255,255,.9); }
      main { max-width: 960px; margin: -40px auto 0; padding: 0 1.5rem 3rem; }
      .card { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; box-shadow: 0 10px 30px rgba(0,0,0,.06); padding: 1.5rem; }
      form { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
      input[type="search"] { flex: 1; min-width: 220px; padding: .7rem .85rem; border: 1px solid #d8dce3; border-radius: 8px; }
      button { padding: .7rem 1.2rem; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
      button:hover { background: #1d4ed8; }
      .meta { color: #6b7280; font-size: .95rem; }
      .jobs { display: grid; gap: 1rem; margin-top: 1.25rem; }
      .job { border: 1px solid #e5e7eb; border-radius: 10px; padding: 1rem 1.25rem; background: #fdfdfd; }
      .job h3 { margin: 0 0 .35rem 0; }
      pre { background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: 8px; overflow: auto; font-size: .9rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>Job Finder</h1>
      <p>Search for roles by title, company, or location.</p>
    </header>
    <main>
      <div class="card">
        <form id="search-form" role="search">
          <input id="q" name="q" type="search" placeholder="e.g., engineer, remote, New York" />
          <button type="submit">Search</button>
        </form>
        <h3>Executed Query (unsafe)</h3>
        <pre id="query">{ }</pre>
        <div class="jobs" id="results"></div>
      </div>
    </main>

    <script>
      const form = document.getElementById('search-form');
      const input = document.getElementById('q');
      const queryOut = document.getElementById('query');
      const resultsOut = document.getElementById('results');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const q = input.value;
        const res = await fetch(`/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        queryOut.textContent = data.sql || '';
        renderJobs(data.results || []);
      });

      function renderJobs(rows) {
        resultsOut.innerHTML = '';
        if (!rows.length) {
          resultsOut.innerHTML = '<div class="meta">No jobs found.</div>';
          return;
        }
        rows.forEach((row) => {
          const div = document.createElement('div');
          div.className = 'job';
          div.innerHTML = `
            <h3>${row.title}</h3>
            <div class="meta">${row.company} · ${row.location}</div>
            <p>${row.description}</p>
          `;
          resultsOut.appendChild(div);
        });
      }
    </script>
  </body>
</html>
