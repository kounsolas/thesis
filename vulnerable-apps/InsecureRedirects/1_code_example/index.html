<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Redirect Demo</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; background: #f6f8fb; }
      main { max-width: 540px; margin: 0 auto; background: #fff; padding: 2rem; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
      h1 { margin-top: 0; }
      form { display: flex; gap: .5rem; margin: 1rem 0; }
      input { flex: 1; padding: .65rem .75rem; }
      button { padding: .65rem 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Redirect</h1>
      <form action="/go" method="get">
        <input name="target" type="text" placeholder="https://example.com" />
        <button type="submit">Go</button>
      </form>
    </main>
  </body>
</html>
